{% extends "dashboard/base/base.html" %}

{% block title %}Dashboard{% endblock title %}

{% block content %}
<div class="container mt-4">
    <h2>Delete Repair</h2>
    <p>Are you sure you want to delete repair for <strong>{{ repair.bike.brand }} {{ repair.bike.model }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'repair_list_page' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
